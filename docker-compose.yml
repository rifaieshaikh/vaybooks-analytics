services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongo
    ports:
      - "8765:8765"
    environment:
      MONGODB_URI: mongodb://mongo:27017/vay-reports
      VAY_HOST: 0.0.0.0
      VAY_PORT: "8765"
    # The built web UI is served by FastAPI from web/dist.

volumes:
  mongo-data:
