name: Desktop Windows

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r desktop/requirements-build.txt

      - name: Build web UI
        working-directory: web
        run: |
          npm ci || npm install
          npm run build

      - name: Build vay-api
        run: python -m PyInstaller --noconfirm --clean desktop/vay-api.spec

      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci || npm install
          npm run download-mongo
          npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Vay-Reports-Setup-Windows
          path: desktop/release/Vay-Reports-Setup-*.exe
          if-no-files-found: error
